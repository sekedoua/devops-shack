name: Chatbot CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

  docker:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t sekbil/chatbot-api:${{ github.sha }} \
            -t sekbil/chatbot-api:latest \
            .

      - name: Push Docker image
        run: |
          docker push sekbil/chatbot-api:${{ github.sha }}
          docker push sekbil/chatbot-api:latest
  deploy:
    name: Deploy to Kubernetes
    needs: docker
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check Kubernetes cluster
        run: |
          kubectl get nodes

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml
          kubectl apply -f ingress.yaml

      - name: Deploy commit image
        run: |
          kubectl set image \
            deployment/chatbot-deployment \
            chatbot=sekbil/chatbot-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/chatbot-deployment \
            --timeout=600s

      - name: Display Kubernetes status
        if: always()
        run: |
          kubectl get deployment chatbot-deployment
          kubectl get pods -o wide
          kubectl get svc
          kubectl get ingress
